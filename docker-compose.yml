services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: reviewflow, POSTGRES_USER: reviewflow, POSTGRES_PASSWORD: reviewflow }
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
  backend:
    build: ./backend
    environment: { DATABASE_URL: jdbc:postgresql://db:5432/reviewflow, DATABASE_USER: reviewflow, DATABASE_PASSWORD: reviewflow, JWT_SECRET: ${JWT_SECRET} }
    depends_on: [db]
    ports: ["8080:8080"]
  frontend:
    build: .
    environment: { NEXT_PUBLIC_API_URL: http://localhost:8080 }
    depends_on: [backend]
    ports: ["3000:3000"]
volumes: { postgres_data: }
