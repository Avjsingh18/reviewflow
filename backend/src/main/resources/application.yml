spring:
  datasource:
    url: "${DATABASE_URL:jdbc:postgresql://localhost:5432/reviewflow}"
    username: "${DATABASE_USER:reviewflow}"
    password: "${DATABASE_PASSWORD:reviewflow}"
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
server:
  forward-headers-strategy: framework
app:
  jwt-secret: "${JWT_SECRET:development-secret-change-me-please}"
  sync-ms: "${GOOGLE_SYNC_INTERVAL_MS:43200000}"
google:
  api-key: "${GOOGLE_API_KEY:}"
